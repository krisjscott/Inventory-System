spring.application.name=order-api
spring.profiles.default=local

server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# left on while we profile the slow endpoints
spring.jpa.properties.hibernate.generate_statistics=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# fail fast on startup if the schema does not match the entities
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

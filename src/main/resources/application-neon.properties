# Accept Neon's standard postgresql:// DATABASE_URL. The Neon datasource
# configuration separates credentials from the JDBC URL for the PostgreSQL driver.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:local-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:local-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
server.forward-headers-strategy=framework
